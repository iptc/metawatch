# Metawatch IPTC scoring rules.
#
# Two distinct concepts:
#
# scored_fields  — the fields that contribute to the per-image score. An image's
#                  score is sum(weights of scored fields present) / sum(all scored
#                  weights) × 100, rounded to two decimal places.
#
# tracked_fields — fields whose presence we record and report on /fields/ but
#                  which do not affect the score. Many of these are legitimately
#                  omitted for safety (location can endanger sources) or for
#                  workflow reasons (studio shoots, archival photos, AI imagery
#                  often have no DateCreated, Keywords, etc.). Penalising for
#                  their absence would be misleading.
#
# Editing this file is the supported way to change the rules. The raw per-image
# data in images.parquet records every field's presence independently, so
# re-running crawler/scripts/export_for_site.py rebuckets historical runs
# without a re-crawl.
#
# Each entry:
#   label:   stable identifier used in metadata_fields and fields.json.
#   weight:  integer weight in the score (only on scored entries).
#   aliases: list of ExifTool tag names that count as this field. Aliases
#            without a "Group:" prefix are matched in any group. Case-insensitive.
#
# The current set is the "Four Cs" of news photo provenance — Creator,
# Copyright, Caption, Credit — weighted equally at 25 each. Industry training
# (PA Style, AP, AFP wire-service guidance) treats these as the universally
# applicable claims that any published news image should carry.

scored_fields:
  - label: Creator
    weight: 25
    aliases: [By-line, Creator, Artist, "XMP:Creator", "IPTC:By-line"]
  - label: CopyrightNotice
    weight: 25
    aliases: [CopyrightNotice, Rights, Copyright, "XMP:Rights"]
  - label: CaptionAbstract
    weight: 25
    aliases: [Caption-Abstract, Description, ImageDescription, "XMP:Description"]
  - label: CreditLine
    weight: 25
    aliases: [Credit, "XMP:Credit"]

tracked_fields:
  - label: Source
    aliases: [Source, "XMP:Source"]
  - label: ObjectName
    aliases: [ObjectName, Title, "XMP:Title"]
  - label: Keywords
    aliases: [Keywords, Subject, "XMP:Subject"]
  - label: DateCreated
    aliases: [DateCreated, CreateDate, DateTimeOriginal, "XMP:DateCreated"]
  - label: LocationCreated
    aliases: [City, Country-PrimaryLocationName, LocationCreatedCity, "XMP-iptcExt:LocationCreated"]
  - label: WebStatement
    aliases: [WebStatement, "XMP:WebStatement"]
  - label: LicensorURL
    aliases: [LicensorURL, Licensor, "XMP-plus:LicensorURL"]
