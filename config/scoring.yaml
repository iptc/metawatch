# Metawatch IPTC scoring rules.
#
# Two distinct concepts:
#
# scored_fields  — the fields that contribute to the per-image score. An image's
#                  score is sum(weights of scored fields present) / sum(all scored
#                  weights) × 100, rounded to two decimal places.
#
# tracked_fields — fields whose presence we record and report on /fields/ but
#                  which do not affect the score. Many of these are legitimately
#                  omitted for safety (location can endanger sources) or for
#                  workflow reasons (studio shoots, archival photos, AI imagery
#                  often have no DateCreated, Keywords, etc.). Penalising for
#                  their absence would be misleading.
#
# Editing this file is the supported way to change the rules. The raw per-image
# data in images.parquet records every field's presence independently, so
# re-running crawler/scripts/export_for_site.py rebuckets historical runs
# without a re-crawl.
#
# Each entry:
#   label:   stable identifier used in metadata_fields and fields.json.
#   weight:  integer weight in the score (only on scored entries).
#   aliases: list of ExifTool tag names that count as this field. Aliases
#            without a "Group:" prefix are matched in any group. Case-insensitive.
#
# The current set is the "Four Cs" of news photo provenance — Creator,
# Copyright, Caption, Credit — weighted equally at 25 each. Industry training
# (PA Style, AP, AFP wire-service guidance) treats these as the universally
# applicable claims that any published news image should carry.

scored_fields:
  - label: Creator
    weight: 25
    aliases: [By-line, Creator, Artist, "XMP-dc:Creator", "IPTC:By-line", "IFD0:Artist", "XMP-plus:ImageCreator", "XMP-plus:ImageCreatorName"]
  - label: Copyright
    weight: 25
    aliases: [CopyrightNotice, Rights, Copyright, "XMP-dc:Rights", "IPTC:CopyrightNotice", "IFD0:Copyright", "XMP-plus:CopyrightOwner"]
  - label: CaptionDescription
    weight: 25
    aliases: [Caption-Abstract, Description, ImageDescription, "XMP:Description", "XMP-dc:Description"]
  - label: CreditLine
    weight: 25
    aliases: [Credit, "XMP:Credit", "XMP-photoshop:Credit"]

tracked_fields:
  - label: AIPromptInformation
    aliases: [AIPromptInformation, "XMP-iptcExt:AIPromptInformation"]
  - label: AIPromptWriterName
    aliases: [AIPromptWriterName, "XMP-iptcExt:AIPromptWriterName"]
  - label: AISystemUsed
    aliases: [AISystemUsed, "XMP-iptcExt:AISystemUsed"]
  - label: AISystemVersionUsed
    aliases: [AISystemVersionUsed, "XMP-iptcExt:AISystemVersionUsed"]
  - label: AltTextAccessibility
    aliases: [AltTextAccessibility, "XMP-iptcCore:AltTextAccessibility"]
  - label: DataMining
    aliases: [DataMining, "XMP-plus:DataMining"]
  - label: DateCreated
    aliases: [DateCreated, DateTimeOriginal, "IPTC:DateCreated", "XMP-photoshop:DateCreated", "ExifIFD:DateTimeOriginal"]
  - label: DigitalSourceType
    aliases: [DigitalSourceType, "XMP-iptcExt:DigitalSourceType"]
  - label: ExtendedDescriptionAccessibility
    aliases: [ExtDescrAccessibility, "XMP-iptcCore:ExtDescrAccessibility"]
  - label: Genre
    aliases: ["XMP-iptcCore:IntellectualGenre", "XMP-iptcExt:GenreCvTerm", "XMP-iptcExt:GenreCvTermId", "XMP-iptcExt:GenreCvTermName"]
  - label: Keywords
    aliases: [Keywords, Subject, "XMP:Subject", "XMP-dc:Subject"]
  # Licensor is the parent struct of LicensorURL etc
  - label: LicensorName
    aliases: ["XMP-plus:LicensorName"]
  - label: LicensorURL
    aliases: [LicensorURL, Licensor, "XMP-plus:LicensorURL"]
  - label: LocationCreated
    aliases: [City, CountryCode, Country-PrimaryLocationName, Location, "XMP-iptcCore:Location", "IPTC:Sub-location", LocationCreatedCity, "XMP-iptcExt:LocationCreated"]
  - label: LocationShown
    aliases: [LocationShownCity, "XMP-iptcExt:LocationShown"]
  - label: ObjectName
    aliases: [ObjectName, Title, "XMP:Title", "XMP-dc:Title"]
  - label: Source
    aliases: [Source, "XMP:Source", "XMP-photoshop:Source"]
  - label: UsageTerms
    aliases: [UsageTerms, "XMP:UsageTerms", "XMP-xmpRights:UsageTerms"]
  - label: WebStatement
    aliases: [WebStatement, "XMP:WebStatement", "XMP-xmpRights:WebStatement"]

