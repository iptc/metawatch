- id: suspilne
  name: Suspilne (Суспільне)
  url: https://suspilne.media/
  homepage: https://suspilne.media/
  category: broadcaster
  language_primary: uk
  notes: 'Ukraine''s national PUBLIC broadcaster (UA:PBC / Suspilne Movlennia). Kept active so the
    status is recorded, but the US crawl runner gets blocked_by_waf: suspilne.media is behind
    Cloudflare and returns HTTP 403 (server: cloudflare, cf-ray) to the datacenter IP, while the
    rss/all.rss feed serves 200 fresh entries from a normal/EU IP. So we cannot measure their images
    from the US runner. C2PA: Suspilne holds a C2PA conformance certificate, but a manual EU spot-check
    (2026-06) found neither the delivered (CDN-resized) nor the full-resolution original news images
    carry a C2PA manifest or any embedded IPTC/XMP — capability, not yet live signing. A high-value
    site to watch on two axes: a C2PA-deployment transition, and the Cloudflare block easing.'
  suggested_by: BQ
  active: true
  discovery:
    strategy: rss
    sitemap_urls: []
    picture_sitemap_url: null
    rss_urls:
    - https://suspilne.media/rss/all.rss
    js_required: false
  sample:
    max_articles: 20
    window_days: 30
