- id: le-soir
  name: Le Soir
  url: https://www.lesoir.be/
  homepage: https://www.lesoir.be/
  category: newspaper
  language_primary: fr
  notes: 'Works from the US crawl runner: 10 articles, 10 images in the
    2026-06-10 crawl via config:rss. The earlier "bot-wall WAF" verdict was a
    single-request testing artifact — the WAF sets a session cookie on the first
    request (robots.txt) that later fetches need; the crawler''s persistent
    client supplies it, but ad-hoc single-URL probes (curl / isolated httpx) do
    not, so they see a 403. Not js_required.'
  suggested_by: BQ
  active: true
  discovery:
    strategy: rss
    sitemap_urls:
    - https://www.lesoir.be/sites/default/files/sitemaps/plus_lesoir_be/sitemapnews-0.xml
    picture_sitemap_url: null
    rss_urls:
    - https://www.lesoir.be/rss2/2/cible_principale
    js_required: false
  sample:
    max_articles: 20
    window_days: 30

