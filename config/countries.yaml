# Country code → display name for every alpha-2 code that appears in
# config/publishers/*.yaml. Used by the static site to render human-friendly
# country labels. Editing here is the supported way to add a new label —
# export_for_site.py mirrors this file into site/src/data/latest/countries_names.json
# at every run.
#
# Note: PyYAML defaults to YAML 1.1 where unquoted "NO" is the boolean false
# (the "Norway problem"). Quote any code whose string form is a YAML boolean —
# specifically NO and ON.

