name: Monthly crawl

on:
  schedule:
    - cron: "0 2 1 * *"   # 02:00 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      country:
        description: "Restrict to a single country (alpha-2). Leave blank for all."
        required: false
      site_id:
        description: "Run a specific site ID (comma-separated). Leave blank for all."
        required: false
      merge:
        description: "Merge into the target run instead of overwriting it (use with site_id or country to patch a partial re-crawl)."
        required: false
        type: boolean
        default: false
      run_date:
        description: "Run directory to write to (YYYY-MM-DD). Leave blank for today's UTC date. Set this to the *original* crawl's date when doing a mid-month merge so the patched rows land in the right monthly snapshot, not a new directory dated today."
        required: false
      sign_requests:
        description: "Sign requests with Web Bot Auth (needs the METAWATCH_WBA_PRIVATE_KEY secret). Scheduled runs always sign; untick only to compare against unsigned behaviour."
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - name: Install ExifTool
        run: sudo apt-get update && sudo apt-get install -y exiftool

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install crawler
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ./crawler

      - name: Run crawl
        env:
          CRAWL_DATE: ${{ steps.date.outputs.date }}
          # Scheduled runs have no inputs, so sign them explicitly; a manual
          # dispatch signs unless sign_requests was unticked. Empty = off.
          METAWATCH_WBA_PRIVATE_KEY: ${{ (github.event_name == 'schedule' || inputs.sign_requests) && secrets.METAWATCH_WBA_PRIVATE_KEY || '' }}
          # Inputs arrive as environment variables, never spliced into the
          # script: ${{ inputs.x }} in a run block is pasted in as shell
          # source, so a crafted value could run commands.
          IN_RUN_DATE: ${{ inputs.run_date }}
          IN_COUNTRY: ${{ inputs.country }}
          IN_SITE_ID: ${{ inputs.site_id }}
          IN_MERGE: ${{ inputs.merge }}
        run: |
          # Determine target date. run_date input wins if set (used for
          # mid-month --merge re-crawls so they land in the original
          # monthly directory); otherwise default to today's UTC date.
          if [ -n "$IN_RUN_DATE" ]; then
            DATE="$IN_RUN_DATE"
            # Refuse anything that isn't YYYY-MM-DD — prevents accidental
            # writes to weird paths like "../../etc/passwd" via the input.
            if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "run_date must be YYYY-MM-DD; got: $DATE"
              exit 1
            fi
          else
            DATE=$(date -u +%Y-%m-%d)
          fi
          if [ -n "$IN_COUNTRY" ] && ! [[ "$IN_COUNTRY" =~ ^[A-Za-z]{2}$ ]]; then
            echo "country must be a two-letter code; got: $IN_COUNTRY"
            exit 1
          fi
          if [ -n "$IN_SITE_ID" ] && ! [[ "$IN_SITE_ID" =~ ^[a-z0-9-]+(,[a-z0-9-]+)*$ ]]; then
            echo "site_id must be comma-separated site ids; got: $IN_SITE_ID"
            exit 1
          fi
          OUT="data/runs/$DATE"
          echo "Writing run to $OUT"
          ARGS=(--output "$OUT")
          if [ -n "$IN_COUNTRY" ]; then ARGS+=(--country "$IN_COUNTRY"); fi
          if [ -n "$IN_SITE_ID" ]; then ARGS+=(--site-id "$IN_SITE_ID"); fi
          if [ "$IN_MERGE" = "true" ]; then ARGS+=(--merge); fi
          .venv/bin/pmd-crawler run "${ARGS[@]}"

      - name: Export latest run for static site
        run: .venv/bin/python crawler/scripts/export_for_site.py

      - name: Commit results
        env:
          IN_RUN_DATE: ${{ inputs.run_date }}
          IN_COUNTRY: ${{ inputs.country }}
          IN_SITE_ID: ${{ inputs.site_id }}
          IN_MERGE: ${{ inputs.merge }}
        run: |
          git config user.name  "metawatch-bot"
          git config user.email "metadata-crawler@iptc.org"
          git add data/runs/ site/src/data/latest/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          # Mirror the date logic from the crawl step so the commit message
          # reflects the actual run directory written to, not just today.
          if [ -n "$IN_RUN_DATE" ]; then
            DATE="$IN_RUN_DATE"
          else
            DATE=$(date -u +%Y-%m-%d)
          fi
          if [ "$IN_MERGE" = "true" ]; then
            SCOPE="${IN_SITE_ID}${IN_COUNTRY}"
            git commit -m "Crawl run $DATE (merge: ${SCOPE:-partial})"
          else
            git commit -m "Crawl run $DATE"
          fi

          # Race-safe push. The crawl takes 30–60 minutes; in that window a
          # human commit can land on main. Rebase onto the latest main and
          # retry. On conflict, prefer our just-generated files (-X ours) —
          # the crawl's output is the newer, authoritative state for the
          # paths we touch (data/runs/<today>/ and site/src/data/latest/).
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt rejected; fetching and rebasing..."
            git fetch origin main
            if ! git rebase -X ours origin/main; then
              echo "Rebase failed; aborting and bailing."
              git rebase --abort || true
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "Giving up after 5 push attempts."
          exit 1
