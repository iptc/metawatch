name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Dependencies are deliberately unpinned (security fixes arrive on their
  # own), so a new release can break the crawler with no commit of ours.
  # selectolax 1.0 did, on 2026-10-03. A fresh install every Monday catches
  # that within a week; the 28th guarantees a check just before the
  # monthly crawl on the 1st. GitHub emails whoever last edited this
  # schedule when a scheduled run fails.
  schedule:
    - cron: "0 6 * * 1"
    - cron: "0 6 28 * *"
  workflow_dispatch:

jobs:
  validate-sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Validate site YAMLs against schema
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml
          import jsonschema

          schema = yaml.safe_load(Path("config/publishers/_schema.yaml").read_text())
          errors = 0
          for p in sorted(Path("config/publishers").glob("*.yaml")):
              if p.name.startswith("_"):
                  continue
              data = yaml.safe_load(p.read_text())
              try:
                  jsonschema.validate(instance=data, schema=schema)
                  print(f"ok {p}")
              except jsonschema.ValidationError as e:
                  print(f"FAIL {p}: {e.message}", file=sys.stderr)
                  errors += 1
          sys.exit(1 if errors else 0)
          PY

  crawler-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e './crawler[dev]'
      - run: .venv/bin/ruff check crawler/src crawler/scripts
      - run: .venv/bin/pytest crawler/tests
      # The crawl workflow's own entry point: fails here, as it would on the
      # 1st, if any module can't import against today's dependency releases.
      - name: Crawler CLI loads
        run: .venv/bin/pmd-crawler --help
      - name: Installed versions (for diagnosing a scheduled failure)
        if: always()
        run: .venv/bin/pip freeze
