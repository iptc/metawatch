name: Build & deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/runs/**"
      - ".github/workflows/build-site.yml"
  # Fire after the monthly crawl completes: commits pushed by the default
  # GITHUB_TOKEN do not trigger other workflows via `push`, so we listen for
  # the crawl workflow finishing instead.
  workflow_run:
    workflows: ["Monthly crawl"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip if a workflow_run trigger fired but the upstream crawl didn't succeed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: Build site
        run: npm run build
        working-directory: site
        env:
          NODE_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
