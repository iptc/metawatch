# Known AI / scraper user-agents tracked for the robots.txt AI-opt-out matrix.
# Sourced primarily from Appendix A of the IPTC Generative AI Opt-Out Best
# Practice Recommendations v2.0 (2026-03), with a handful of additions from
# SPEC.md §8 that the IPTC list doesn't include yet (DeepSeek, Gemini deep
# research, Mistral, xAI Grok, etc.).
#
# Each entry pairs a user-agent token (as it appears in robots.txt User-agent:
# lines) with an operator label, used for grouping on the /ai-policy/ page.
# RFC 9309 makes UA matching case-insensitive, so we deliberately do not
# duplicate lowercase variants (e.g. meta-externalagent vs Meta-ExternalAgent).
#
# Adding bots: please keep alphabetical within operator. The UA token is what
# we test against robots.txt with Protego; the operator label is display-only.
uas:
  - { ua: AI2Bot,                       operator: AI2 }
  - { ua: AliyunSecBot,                 operator: Alibaba Cloud }
  - { ua: Amazonbot,                    operator: Amazon }
  - { ua: anthropic-ai,                 operator: Anthropic }
