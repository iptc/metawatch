# Known AI / scraper user-agents tracked for the robots.txt AI-opt-out matrix.
# Sourced from SPEC.md §8. Each entry pairs a user-agent token (as it appears
# in robots.txt User-agent: lines) with an operator label, used for grouping
# on the /ai-policy/ page.
#
# Adding bots: please keep alphabetical within operator. The UA token is what
# we test against robots.txt with Protego; the operator label is display-only.
